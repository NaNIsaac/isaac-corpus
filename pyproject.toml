[project]
name = "isaac-corpus"
version = "0.2.0"
description = "Private-first conversation corpus tooling for persona and stylometry research."
requires-python = ">=3.11"
dependencies = ["pyarrow>=17"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
kakao-import = "isaac_corpus.cli:kakao_main"
chatgpt-import = "isaac_corpus.cli:chatgpt_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
